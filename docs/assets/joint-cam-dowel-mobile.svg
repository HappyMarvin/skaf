<svg data-joint-type="cam-dowel" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 2000" role="group" aria-label="Как работает эксцентрик со шкантом" style="font-family:Arial,sans-serif"><defs><marker id="vileta-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#617D50" stroke-width="1.8"/></marker></defs><g transform="translate(0 0)"><text x="225" y="40" text-anchor="middle" font-size="28" fill="#445845">1. Установите элементы</text><rect x="64" y="128" width="32" height="284" fill="#F5F8EF" stroke="#617450" stroke-width="2"/><rect x="195" y="210" width="230" height="120" fill="#F5F8EF" stroke="#617450" stroke-width="2"/><path d="M96 244H163V256H96Z" fill="#CAD7BB" stroke="#617450" stroke-width="2"/><path d="M96 295H159V309H96Z" fill="#D6BD92" stroke="#917C57" stroke-width="2"/><path d="M110 295 L110 309" fill="none" stroke="#A58C62" stroke-width="1.8" /><path d="M122 295 L122 309" fill="none" stroke="#A58C62" stroke-width="1.8" /><path d="M134 295 L134 309" fill="none" stroke="#A58C62" stroke-width="1.8" /><path d="M146 295 L146 309" fill="none" stroke="#A58C62" stroke-width="1.8" /><circle cx="273" cy="250" r="30" fill="#DFE9D3" stroke="#445845" stroke-width="2.5"/><path d="M262 241H284M273 231V251" stroke="#617450" stroke-width="3"/><path d="M283 265H261M269 257L261 265L269 273" fill="none" stroke="#617450" stroke-width="2"/><path d="M165 250 L193 250" fill="none" stroke="#617450" stroke-width="1.8" stroke-dasharray="4 4"/><path d="M161 302 L193 302" fill="none" stroke="#617450" stroke-width="1.8" stroke-dasharray="4 4"/><path d="M269 381 L215 381" fill="none" stroke="#617450"   stroke-width="3"/><path d="M225.5 386.25L215 381L225.5 375.75" fill="none" stroke="#617450" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="490" text-anchor="middle" font-size="27" fill="#445845">Шток, шкант</text><text x="225" y="528" text-anchor="middle" font-size="27" fill="#445845">и круглый эксцентрик</text></g><g transform="translate(0 610)"><text x="225" y="40" text-anchor="middle" font-size="28" fill="#445845">2. Соедините панели</text><rect x="64" y="128" width="32" height="284" fill="#F5F8EF" stroke="#617450" stroke-width="2"/><rect x="96" y="210" width="230" height="120" fill="#F5F8EF" stroke="#617450" stroke-width="2"/><path d="M96 244H174V256H96Z" fill="#CAD7BB" stroke="#617450" stroke-width="2"/><path d="M96 295H178V309H96Z" fill="#D6BD92" stroke="#917C57" stroke-width="2"/><path d="M110 295 L110 309" fill="none" stroke="#A58C62" stroke-width="1.8" /><path d="M122 295 L122 309" fill="none" stroke="#A58C62" stroke-width="1.8" /><path d="M134 295 L134 309" fill="none" stroke="#A58C62" stroke-width="1.8" /><path d="M146 295 L146 309" fill="none" stroke="#A58C62" stroke-width="1.8" /><circle cx="174" cy="250" r="30" fill="#DFE9D3" stroke="#445845" stroke-width="2.5"/><path d="M163 241H185M174 231V251" stroke="#617450" stroke-width="3"/><path d="M184 265H162M170 257L162 265L170 273" fill="none" stroke="#617450" stroke-width="2"/><text x="225" y="490" text-anchor="middle" font-size="27" fill="#445845">Шток входит</text><text x="225" y="528" text-anchor="middle" font-size="27" fill="#445845">в эксцентрик</text></g><g transform="translate(0 1220)"><text x="225" y="40" text-anchor="middle" font-size="28" fill="#445845">3. Зафиксируйте узел</text><rect x="64" y="128" width="32" height="284" fill="#F5F8EF" stroke="#617450" stroke-width="2"/><rect x="96" y="210" width="230" height="120" fill="#F5F8EF" stroke="#617450" stroke-width="2"/><path d="M96 244H174V256H96Z" fill="#CAD7BB" stroke="#617450" stroke-width="2"/><path d="M96 295H178V309H96Z" fill="#D6BD92" stroke="#917C57" stroke-width="2"/><path d="M110 295 L110 309" fill="none" stroke="#A58C62" stroke-width="1.8" /><path d="M122 295 L122 309" fill="none" stroke="#A58C62" stroke-width="1.8" /><path d="M134 295 L134 309" fill="none" stroke="#A58C62" stroke-width="1.8" /><path d="M146 295 L146 309" fill="none" stroke="#A58C62" stroke-width="1.8" /><circle cx="174" cy="250" r="30" fill="#DFE9D3" stroke="#445845" stroke-width="2.5"/><path d="M163 241H185M174 231V251" stroke="#617450" stroke-width="3"/><path d="M140 207A55 55 0 1 1 223 281M223 267V281H237" fill="none" stroke="#617450" stroke-width="3" stroke-linecap="round"/><text x="225" y="490" text-anchor="middle" font-size="27" fill="#445845">Поверните эксцентрик</text><text x="225" y="528" text-anchor="middle" font-size="27" fill="#445845">до фиксации</text></g><text x="230" y="1875" text-anchor="middle" font-size="22" fill="#445845">До совмещения стрелка —</text><text x="230" y="1908" text-anchor="middle" font-size="22" fill="#445845">к входу штока.</text><text x="230" y="1941" text-anchor="middle" font-size="22" fill="#445845">Поверните до фиксации.</text><text x="230" y="1974" text-anchor="middle" font-size="22" fill="#445845">Не затягивайте с усилием.</text></svg>