<svg data-joint-type="confirmat" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 720" role="group" aria-label="Как работает соединение конфирматом" style="font-family:Arial,sans-serif"><defs><marker id="vileta-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#617D50" stroke-width="1.8"/></marker></defs><g transform="translate(0 0)"><text x="225" y="40" text-anchor="middle" font-size="28" fill="#445845">1. Совместите детали</text><rect x="120" y="130" width="32" height="282" fill="#F5F8EF" stroke="#617450" stroke-width="2"/><rect x="186" y="250" width="240" height="32" fill="#F5F8EF" stroke="#617450" stroke-width="2"/><path d="M55 266 L430 266" fill="none" stroke="#9DAA91" stroke-width="1.8" stroke-dasharray="6 6" /><path d="M174 308 L155 308" fill="none" stroke="#617450"   stroke-width="3"/><path d="M165.5 313.25L155 308L165.5 302.75" fill="none" stroke="#617450" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="490" text-anchor="middle" font-size="27" fill="#445845">По готовым</text><text x="225" y="528" text-anchor="middle" font-size="27" fill="#445845">отверстиям</text></g><g transform="translate(460 0)"><text x="225" y="40" text-anchor="middle" font-size="28" fill="#445845">2. Введите конфирмат</text><rect x="120" y="130" width="32" height="282" fill="#F5F8EF" stroke="#617450" stroke-width="2"/><rect x="152" y="250" width="274" height="32" fill="#F5F8EF" stroke="#617450" stroke-width="2"/><path d="M55 266 L430 266" fill="none" stroke="#9DAA91" stroke-width="1.8" stroke-dasharray="6 6" /><path d="M59 254H63L79 259H157V273H79L63 278H59Z" fill="#C9D8B8" stroke="#445845" stroke-width="2"/><path d="M89 273 L95 259" fill="none" stroke="#617450" stroke-width="1.8" /><path d="M100 273 L106 259" fill="none" stroke="#617450" stroke-width="1.8" /><path d="M111 273 L117 259" fill="none" stroke="#617450" stroke-width="1.8" /><path d="M122 273 L128 259" fill="none" stroke="#617450" stroke-width="1.8" /><path d="M133 273 L139 259" fill="none" stroke="#617450" stroke-width="1.8" /><path d="M144 273 L150 259" fill="none" stroke="#617450" stroke-width="1.8" /><path d="M45 215 L109 215" fill="none" stroke="#617450"   stroke-width="3"/><path d="M98.5 209.75L109 215L98.5 220.25" fill="none" stroke="#617450" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="490" text-anchor="middle" font-size="27" fill="#445845">Ф4 · 7 × 50 мм</text><text x="225" y="528" text-anchor="middle" font-size="27" fill="#445845">в торец второй панели</text></g><g transform="translate(920 0)"><text x="225" y="40" text-anchor="middle" font-size="28" fill="#445845">3. Стяните соединение</text><rect x="120" y="130" width="32" height="282" fill="#F5F8EF" stroke="#617450" stroke-width="2"/><rect x="152" y="250" width="274" height="32" fill="#F5F8EF" stroke="#617450" stroke-width="2"/><path d="M55 266 L430 266" fill="none" stroke="#9DAA91" stroke-width="1.8" stroke-dasharray="6 6" /><path d="M120 254H124L140 259H218V273H140L124 278H120Z" fill="#C9D8B8" stroke="#445845" stroke-width="2"/><path d="M150 273 L156 259" fill="none" stroke="#617450" stroke-width="1.8" /><path d="M161 273 L167 259" fill="none" stroke="#617450" stroke-width="1.8" /><path d="M172 273 L178 259" fill="none" stroke="#617450" stroke-width="1.8" /><path d="M183 273 L189 259" fill="none" stroke="#617450" stroke-width="1.8" /><path d="M194 273 L200 259" fill="none" stroke="#617450" stroke-width="1.8" /><path d="M205 273 L211 259" fill="none" stroke="#617450" stroke-width="1.8" /><path d="M120 266H99V208H63" fill="none" stroke="#617450" stroke-width="7" stroke-linejoin="round"/><text x="225" y="490" text-anchor="middle" font-size="27" fill="#445845">Подтяните вручную</text><text x="225" y="528" text-anchor="middle" font-size="27" fill="#445845">шестигранным ключом</text></g><text x="690" y="620" text-anchor="middle" font-size="27" fill="#445845">Схематичный разрез одного узла.</text><text x="690" y="656" text-anchor="middle" font-size="27" fill="#445845">Используйте только заводские отверстия.</text></svg>