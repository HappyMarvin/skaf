<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 65 940 710" role="group" aria-label="Накладные и полунакладные петли" style="font-family:Arial,sans-serif"><defs><marker id="vileta-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#617D50" stroke-width="1.8"/></marker></defs><defs><pattern id="half-overlay-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="10" height="10" fill="#EEF0E9"/><path d="M0 0V10" stroke="#6C7C60" stroke-width="3"/></pattern></defs><g class="diagram-part" data-part="13"><rect x="320" y="130" width="86.9" height="97.9" fill="#C5D7B4" stroke="#607A51" stroke-width="2"/></g><g class="diagram-part" data-part="4"><rect x="320" y="234" width="86.9" height="344.3" fill="#C5D7B4" stroke="#607A51" stroke-width="2"/></g><g class="diagram-part" data-part="12"><rect x="410" y="130" width="86.9" height="97.9" fill="url(#half-overlay-hatch)" stroke="#607A51" stroke-width="2"/></g><g class="diagram-part" data-part="5"><rect x="410" y="234" width="86.9" height="344.3" fill="url(#half-overlay-hatch)" stroke="#607A51" stroke-width="2"/></g><g class="diagram-part" data-part="11"><rect x="500" y="130" width="86.9" height="97.9" fill="#C5D7B4" stroke="#607A51" stroke-width="2"/></g><g class="diagram-part" data-part="6"><rect x="500" y="234" width="86.9" height="344.3" fill="#C5D7B4" stroke="#607A51" stroke-width="2"/></g><g class="diagram-part diagram-callout" data-part="Ф5" tabindex="0" role="button" aria-label="Показать накладные петли"><rect x="40" y="173" width="42" height="32" rx="3" fill="#C5D7B4" stroke="#607A51"/><text x="40" y="248" font-size="30" fill="#445845">Накладные</text><text x="40" y="288" font-size="29" fill="#445845">12 всего</text><text x="40" y="328" font-size="23" fill="#626D5A">Крайние четыре</text><text x="40" y="357" font-size="23" fill="#626D5A">фасада</text><path d="M40 444H178L198 452H240V466H195L175 458H40Z" fill="#DEE7D3" stroke="#617450" stroke-width="2"/><text x="40" y="506" font-size="22" fill="#626D5A">Почти прямое плечо</text></g><g class="diagram-part diagram-callout" data-part="Ф11" tabindex="0" role="button" aria-label="Показать полунакладные петли"><rect x="665" y="173" width="42" height="32" rx="3" fill="url(#half-overlay-hatch)" stroke="#607A51"/><text x="665" y="248" font-size="29" fill="#445845">Полунакладные</text><text x="665" y="288" font-size="29" fill="#445845">6 всего</text><text x="665" y="328" font-size="23" fill="#626D5A">Два средних</text><text x="665" y="357" font-size="23" fill="#626D5A">фасада</text><path d="M665 444H721L756 471H865V485H750L716 458H665Z" fill="#DEE7D3" stroke="#617450" stroke-width="2"/><text x="665" y="525" font-size="22" fill="#626D5A">Плечо с изгибом</text></g><text x="460" y="620" text-anchor="middle" font-size="20" fill="#626D5A">Профиль плеча показан схематично, без крепёжных отверстий</text><text x="460" y="668" text-anchor="middle" font-size="24" fill="#445845">Распределение двух типов петель по фасадам</text><text x="460" y="706" text-anchor="middle" font-size="22" fill="#626D5A">Положение и крепление — по заводской схеме</text></svg>